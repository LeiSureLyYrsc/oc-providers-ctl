[package]
name = "oc-providers-ctl"
version = "0.1.0"
description = "Desktop shell for inspecting and safely editing OpenCode provider configuration"
edition = "2021"
publish = false

[lib]
name = "oc_providers_ctl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
oc-providers-core = { path = "../crates/core" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
