[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
sha2 = "0.10.9"
dirs = "6.0.0"
tempfile = "3.20.0"
similar = "3.2.1"
strsim = "0.11.1"
url = "2.5.4"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1.47.1", features = ["sync", "rt", "macros"] }

[workspace.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
]
