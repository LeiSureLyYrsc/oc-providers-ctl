<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>配置血统台 · OpenCode Providers</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('occtl.theme');
        var theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var storedDensity = localStorage.getItem('occtl.density');
        document.documentElement.setAttribute('data-density', storedDensity === 'comfortable' ? 'comfortable' : 'compact');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-density', 'compact');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
