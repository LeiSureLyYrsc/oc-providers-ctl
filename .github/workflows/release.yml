# Builds the desktop binaries without updater or signing artifacts.
# Outputs: Windows x64 NSIS setup.exe, Linux x64 .deb, Linux x64 .AppImage,
# and SHA256SUMS.txt. Manual runs on main upload the consolidated artifact
# `oc-providers-ctl-<version>-x64`; tag pushes matching v<version> additionally
# create/update a draft GitHub Release. Linux bundles use the Ubuntu 22.04 baseline.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Tests and version preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Validate app, package and crate versions
        id: versions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/check-versions.js" <<'NODE'
          const fs = require("fs");

          const event = process.env.GITHUB_EVENT_NAME;
          const ref = process.env.GITHUB_REF || "";
          const refName = process.env.GITHUB_REF_NAME || "";

          if (event === "workflow_dispatch" && ref !== "refs/heads/main") {
            console.error(`Manual builds are restricted to main; got ${ref}.`);
            process.exit(1);
          }

          const appVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const pkgVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;

          let section = "";
          let crateVersion = null;
          for (const line of fs.readFileSync("src-tauri/Cargo.toml", "utf8").split(/\r?\n/)) {
            const header = line.match(/^\[([^\]]+)\]$/);
            if (header) {
              section = header[1].trim();
              continue;
            }
            if (section === "package") {
              const value = line.match(/^version\s*=\s*"([^"]+)"/);
              if (value) {
                crateVersion = value[1];
                break;
              }
            }
          }

          if (!appVersion || !pkgVersion || !crateVersion) {
            console.error("Could not read app, package or crate version.");
            process.exit(1);
          }
          if (pkgVersion !== appVersion) {
            console.error(`package.json version ${pkgVersion} does not match tauri version ${appVersion}.`);
            process.exit(1);
          }
          if (crateVersion !== appVersion) {
            console.error(`src-tauri crate version ${crateVersion} does not match tauri version ${appVersion}.`);
            process.exit(1);
          }

          if (event === "push" && ref.startsWith("refs/tags/")) {
            if (refName !== `v${appVersion}`) {
              console.error(`Tag ${refName} does not match app version ${appVersion}.`);
              process.exit(1);
            }
            console.log(`Tag ${refName} matches app, package and crate version ${appVersion}.`);
          } else if (event === "workflow_dispatch") {
            console.log(`Manual build from ${ref} for version ${appVersion}; no release will be published.`);
          } else {
            console.error(`Unexpected event/ref combination: ${event} ${ref}.`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${appVersion}\n`);
          NODE
          node "$RUNNER_TEMP/check-versions.js"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Format check (core only)
        run: cargo fmt -p oc-providers-core -- --check

      - name: Clippy (core only)
        run: cargo clippy -p oc-providers-core --all-targets --locked -- -D warnings

      - name: Tests (core only)
        run: cargo test -p oc-providers-core --locked

  build-windows:
    name: Windows x64 / NSIS
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify Cargo.lock is current
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: "."
          args: "--bundles nsis -- --locked"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Upload NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux x64 / deb + AppImage
    needs: preflight
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install Ubuntu 22.04 baseline toolchain and Node.js
        working-directory: /tmp
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils \
            xz-utils
          NODE_VERSION=22.14.0
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/node-v22.14.0-linux-x64.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          (cd /tmp && grep -E "  node-v${NODE_VERSION}-linux-x64\\.tar\\.xz$" SHASUMS256.txt | sha256sum -c -)
          tar -xJf /tmp/node-v22.14.0-linux-x64.tar.xz -C /usr/local --strip-components=1
          node --version
          npm --version
          ldd --version
          pkg-config --modversion webkit2gtk-4.1
          patchelf --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify Cargo.lock is current
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build deb and AppImage bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: "."
          args: "--bundles deb,appimage -- --locked"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify Linux bundles exist
        run: |
          set -euxo pipefail
          test "$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1

      - name: Upload deb bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x64-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload AppImage bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x64-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Consolidated installer artifact
    needs: [preflight, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download individual workflow artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Verify three installers and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          exe=(*.exe)
          deb=(*.deb)
          appimage=(*.AppImage)
          if (( ${#exe[@]} != 1 || ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            printf 'Expected 1 NSIS setup.exe, 1 deb and 1 AppImage, got %d/%d/%d\n' \
              "${#exe[@]}" "${#deb[@]}" "${#appimage[@]}" >&2
            ls -la
            exit 1
          fi
          sha256sum "${exe[@]}" "${deb[@]}" "${appimage[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload consolidated downloadable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oc-providers-ctl-${{ needs.preflight.outputs.version }}-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub release
    needs: [preflight, aggregate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download consolidated artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: oc-providers-ctl-${{ needs.preflight.outputs.version }}-x64
          path: release-assets

      - name: Verify consolidated artifact and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          installers=(*.exe *.deb *.AppImage)
          test "${#installers[@]}" -eq 3
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.exe release-assets/*.deb release-assets/*.AppImage release-assets/SHA256SUMS.txt)
          notes="Draft release ${TAG}. Windows x64 NSIS installer and Linux x64 deb/AppImage. Verify assets with SHA256SUMS.txt. Builds are unsigned and may trigger OS warnings. The Linux bundles are built on an Ubuntu 22.04 baseline; AppImage portability is not guaranteed. No updater artifacts are included."
          if gh release view "$TAG" --json isDraft --jq '.isDraft' >/tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" != "true" ]]; then
              echo "Release $TAG exists and is not a draft; refusing to overwrite." >&2
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "oc-providers-ctl ${TAG}" \
              --notes "$notes" \
              "${files[@]}"
          fi
